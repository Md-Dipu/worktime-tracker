# Label any file change in the repository root
root:
  - changed-files:
      - any-glob-to-any-file: '*'

# Label any change in the entire repository
AnyChange:
  - changed-files:
      - any-glob-to-any-file: '**'

# Label documentation-related changes:
# - Files under the 'docs' and 'guides' directories
# - Any Markdown file anywhere in the repo
Documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'guides/**'
          - '**/*.md'

# Label changes in CLI client code
cli:
  - changed-files:
      - any-glob-to-any-file: 'cli/**'

# Label changes in server-side code (Express & Mongoose related)
server:
  - changed-files:
      - any-glob-to-any-file: 'server/**'

# Label changes in TypeScript files
typescript:
  - changed-files:
      - any-glob-to-any-file: '**/*.ts'

# Label changes in test files (for both CLI and server tests)
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'cli/tests/**'
          - 'server/tests/**'
          - 'tests/**'

# Label configuration file changes (e.g., package files, build configs, and linting)
config:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - '*.config.js'
          - 'tsconfig.json'
          - '.eslintrc*'
          - '.prettierrc*'

# Label CI/CD related changes, including GitHub Actions workflows
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

# Label dependency update changes (affecting lockfiles and package definitions)
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'

# Label PRs for feature work based on the head branch name containing or starting with "feature"
feature:
  - head-branch:
      - '^feature'
      - 'feature'

# Label PRs intended for release when the base branch is 'main'
release:
  - base-branch: 'main'

# Label bugfix-related PRs
bugfix:
  - head-branch:
      - '^bugfix'
      - 'bugfix'
  - changed-files:
      - any-glob-to-any-file:
          - 'cli/**'
          - 'server/**'

# Label hotfix-related PRs
hotfix:
  - head-branch:
      - '^hotfix'
      - 'hotfix'
  - changed-files:
      - any-glob-to-any-file:
          - 'cli/**'
          - 'server/**'

# Label improvements or enhancements
improvement:
  - head-branch:
      - '^improvement'
      - 'improvement'
  - changed-files:
      - any-glob-to-any-file:
          - 'cli/**'
          - 'server/**'

# Label core functionality updates (significant architectural or major refactors)
core:
  - changed-files:
      - any-glob-to-any-file:
          - 'server/core/**'
          - 'cli/core/**'
          - 'server/middleware/**'

# Label security-related changes (e.g., authentication, security patches)
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'server/auth/**'
          - 'server/security/**'
          - 'cli/auth/**'
          - '**/auth/**'
          - '**/security/**'

# Label database changes (Migrations, schema updates, DB queries)
database:
  - changed-files:
      - any-glob-to-any-file:
          - 'server/db/**'
          - 'server/models/**'
          - 'server/migrations/**'

# Label refactoring (significant code restructuring without adding features)
refactor:
  - changed-files:
      - any-glob-to-any-file:
          - 'cli/**'
          - 'server/**'
  - head-branch:
      - '^refactor'
      - 'refactor'

# Label experimental features under testing
experimental:
  - head-branch:
      - '^experimental'
      - 'experimental'

# Label performance-related optimizations
performance:
  - changed-files:
      - any-glob-to-any-file:
          - 'cli/**'
          - 'server/**'
  - head-branch:
      - '^perf'
      - 'performance'
